[project]
name = "{{cookiecutter.project_slug}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.description}}"
requires-python = ">=3.10,<4.0"
authors = [
  {name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}"},
]
{% if cookiecutter.license == "MIT" %}license = "MIT"
license-files = [ "LICENSE" ]
{% elif cookiecutter.license == "Apache" %}license = "Apache-2.0"
license-files = [ "LICENSE" ]
{% elif cookiecutter.license == "BSD-3" %}license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
{% endif %}
readme = "README.md"
repository = "https://github.com/{{cookiecutter.github_owner}}/{{cookiecutter.project_slug}}"
homepage = "https://{{cookiecutter.project_slug}}.readthedocs.io"
keywords = []
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
{% if cookiecutter.license == "MIT" %}    "License :: OSI Approved :: MIT License",
{% elif cookiecutter.license == "Apache" %}    "License :: OSI Approved :: Apache Software License",
{% elif cookiecutter.license == "BSD-3" %}    "License :: OSI Approved :: BSD License",
{% endif %}
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/{{cookiecutter.package_name}}"]

[project.urls]
"Homepage"      = "https://{{cookiecutter.project_slug}}.readthedocs.io"
"Documentation" = "https://{{cookiecutter.project_slug}}.readthedocs.io"
"Repository"    = "https://github.com/{{cookiecutter.github_owner}}/{{cookiecutter.project_slug}}"
"Issues"        = "https://github.com/{{cookiecutter.github_owner}}/{{cookiecutter.project_slug}}/issues"
"Changelog"     = "https://{{cookiecutter.project_slug}}.readthedocs.io/en/latest/changelog.html"

[dependency-groups]
docs = [
    "doc8>=1.1.2",
    "furo>=2024.8.6",
    "readme-renderer[md]>=44.0",
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-tabs>=3.4.7",
]
typing = [
    "pyright>=1.1.390",
    "mypy>=1.19.1",
]
lint = [
    "ruff>=0.15.0",
    "readme-renderer[md]>=43.0",
    "doc8>=1.1.2",
    "bandit[toml,sarif]>=1.7.10"
]
coverage  = ["coverage[toml]>=7.6.1"]
test = [
    { include-group = "coverage" },
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]
dev = [
    { include-group = "typing" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
    "packaging>=24.2",
    "tomlkit>=0.13.3",
    "ipdb>=0.13.13",
    "ipython>=8.18.1",
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = ["src"]
packages = ["{{cookiecutter.package_name}}"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src/{{cookiecutter.package_name}}"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportDuplicateImport = true

[tool.doc8]
max-line-length = 100
sphinx = true

[tool.pytest.ini_options]
python_files = "test*.py"
norecursedirs = "*.egg .eggs dist build docs .tox .git __pycache__"
addopts = [
    "--strict-markers",
    "--cov={{cookiecutter.package_name}}",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
branch = true
source = ["{{cookiecutter.package_name}}"]
concurrency = ["thread", "multiprocessing"]
parallel = true
relative_files = true
command_line = "-m pytest --cov={{cookiecutter.package_name}}"

[tool.coverage.paths]
source = ["{{cookiecutter.package_name}}"]

[tool.ruff]
line-length = 88
exclude = ["doc", "dist"]
target-version = "py310"

[tool.ruff.lint]
exclude = ["tests/**/*"]

[tool.bandit]
targets = ["src"]
exclude_dirs = [
    "./tests",
    "./.venv",
    "./doc",
]

skips = [
    "B101",  # assert_used - assertions are fine in tests
    "B110",  # Try, Except, Pass detected - these are intentional
]
